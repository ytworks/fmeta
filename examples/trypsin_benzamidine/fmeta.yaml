# Trypsin-benzamidine, the classic funnel metadynamics test case (PDB entry 3PTB).
#
#   1. Download 3ptb.pdb from the PDB into this directory.
#   2. fmeta prepare fmeta.yaml -o run && fmeta funnel run     # look at the funnel first:
#      load run/prepared/funnel.pdb together with run/prepared/topology.cif
#   3. fmeta equilibrate run && fmeta run run --gpus 0 && fmeta analyze run --plot
#
# The ligand (residue BEN) is cut out of the entry and protonated from the SMILES
# below (benzamidinium, charge +1); needs RDKit. fix_protein removes the crystal
# waters and the calcium ion and rebuilds any missing side-chain atoms (PDBFixer).
# This configuration has not been run against the real entry in development
# (no access to the PDB from there); the same route is tested on a small fixture.
input:
  complex: 3ptb.pdb
  ligand_resname: BEN
  ligand_smiles: "NC(=[NH2+])c1ccccc1"

system:
  fix_protein: true
  ligand_method: openff        # needs openmmforcefields (see environment.yml)
  temperature: 300.0

metad:
  bias_factor: 10.0
  height: 1.5

run:
  length_ns: 500.0             # per replica; watch dG(t) and the rebinding count in the analysis
  replicas: 5
