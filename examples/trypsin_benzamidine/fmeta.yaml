# Trypsin-benzamidine, the classic funnel metadynamics test case (PDB entry 3PTB).
#
# Two files are needed, nothing else:
#   3ptb.pdb         - the entry as downloaded. Waters, the calcium ion and the crystal
#                      ligand are removed, missing atoms are rebuilt (if PDBFixer is
#                      installed) and hydrogens are added automatically.
#   benzamidine.sdf  - benzamidine in its bound pose, in the frame of 3ptb.pdb.
#                      To cut it out of the entry itself, with hydrogens for the charged
#                      (amidinium) form:
#                        fmeta split 3ptb.pdb --resname BEN --smiles "NC(=[NH2+])c1ccccc1" -o .
#                        mv ligand.sdf benzamidine.sdf
#
#   fmeta prepare fmeta.yaml -o run && fmeta funnel run     # look at the funnel first:
#      load run/prepared/funnel.pdb together with run/prepared/topology.cif
#   fmeta equilibrate run && fmeta run run --gpus 0 && fmeta analyze run --plot
#
# Not run against the real entry during development (no access to the PDB from there);
# the same steps are tested on a small bundled system.
input:
  protein: 3ptb.pdb
  ligand: benzamidine.sdf

system:
  temperature: 300.0           # ligand parameters: OpenFF by default (conda environment)

metad:
  bias_factor: 10.0
  height: 1.5

run:
  length_ns: 500.0             # per replica; watch dG(t) and the rebinding count in the analysis
  replicas: 5
