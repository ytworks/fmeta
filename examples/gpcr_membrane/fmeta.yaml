# A GPCR with a ligand in the orthosteric site, embedded in POPC.
#
# Two files are needed:
#   protein.pdb  - the receptor. Best taken from the OPM database, where structures are
#                  already oriented: membrane normal along z, midplane at z = 0. OPM's dummy
#                  membrane atoms, waters and other hetero groups are removed automatically.
#   ligand.sdf   - the ligand in its bound pose, in the same frame as the protein
#
# The funnel is placed before the membrane is built and treats the bilayer as a slab, so
# it points into the extracellular or intracellular water. Check it before running:
#   fmeta prepare fmeta.yaml -o run && fmeta funnel run
# and load run/prepared/funnel.pdb together with run/prepared/topology.cif.
#
# Only the difference from the preset is here. The preset gives the POPC bilayer with its
# midplane at z = 0, the orientation check and every other official default (5 replicas,
# 10 ns of free equilibration with a membrane, ...): "fmeta init --preset membrane" writes
# them all, docs/configuration.md gives the reasons, and run/config.yaml records the values
# that were used.
preset: membrane

input:
  protein: protein.pdb
  ligand: ligand.sdf

system:
  temperature: 310.0
  padding: 1.5                 # nm of lipid around the receptor in the membrane plane

# Another lipid (POPE, DLPC, DLPE, DMPC, DOPC or DPPC), or a protein that is not oriented yet
# (auto re-orients it from its hydrophobic belt: a coarse estimate):
# membrane:
#   lipid: POPE
#   orient: auto

# For ligands that leave sideways into the bilayer, or to pick the vestibule by hand:
# funnel:
#   exit_direction: [0, 0, 1]

run:
  length_ns: 1000.0
  # walkers: 4                 # share one bias between 4 walkers per replica
  # gpus: [0, 1, 2, 3]
