name: image

# Publishes the official image to the GitHub container registry. It runs only for a version
# tag or when it is started by hand: nothing is published by a push or a pull request.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build, test and publish the image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space for the image (about 6 GB)
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android
      - name: Build the image from the lock
        run: scripts/in_docker.sh --build fmeta --help
      - name: Lint and CPU tests inside the image
        run: |
          scripts/in_docker.sh ruff check .
          scripts/in_docker.sh python -m pytest -q -ra
      - name: Push to ghcr.io
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag fmeta:dev "$image:${GITHUB_REF_NAME//\//-}"
          docker push "$image:${GITHUB_REF_NAME//\//-}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
              docker tag fmeta:dev "$image:latest"
              docker push "$image:latest"
          fi
