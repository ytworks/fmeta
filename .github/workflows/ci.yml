name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  cpu:
    # GitHub-hosted runners have no GPU and no conda-only packages: this job checks everything
    # that runs on the OpenMM Reference / CPU platforms. GPU verification is scripts/gpu_gates.py
    # on a GPU machine (docs/gpu-runbook.md); its recorded evidence in bench/results/ is
    # validated here.
    name: CPU checks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install (OpenMM from PyPI; RDKit and matplotlib for the optional paths)
        run: python -m pip install -e ".[dev,prep,plots]"
      - name: Install PDBFixer if it builds here (its tests are skipped otherwise)
        run: python -m pip install pdbfixer || echo "::warning::PDBFixer not installed; its tests are skipped"
      - name: Lint
        run: ruff check .
      - name: PROGRESS.md size budget and layout
        run: python scripts/check_progress_size.py
      - name: GPU evidence index (bench/results)
        run: python scripts/verify_bench_results.py
      - name: CPU tests
        run: python -m pytest -q -ra
