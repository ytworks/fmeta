# Full environment for production use (GPU + automatic ligand parameterisation).
#   conda env create -f environment.yml && conda activate fmeta && pip install -e .
name: fmeta
channels:
  - conda-forge
dependencies:
  - python=3.12
  - openmm>=8.1          # conda-forge builds ship the CUDA/OpenCL platforms
  - numpy
  - scipy
  - pyyaml
  - pdbfixer
  - openmmforcefields    # GAFF / OpenFF template generators: ligand parameters from an SDF
  - openff-toolkit
  - ambertools           # AM1-BCC charges and GAFF atom typing for the two generators
  - rdkit
  - matplotlib
  - pytest
  - pip
